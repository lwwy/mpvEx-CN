name: Build ARM64 APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build ARM64 Debug APK
        run: |
          chmod +x ./gradlew
          # 改成了编译 Debug 版本，不需要证书
          ./gradlew assembleStandardDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-CN-arm64-debug
          # 这里用 **/*.apk 自动匹配生成的包
          path: "**/*.apk"
          if-no-files-found: error
